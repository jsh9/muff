# Build and release Muff.
#
# This workflow is specific to the Muff fork and replaces Ruff's `release.yml` for releases.
# Ruff's release workflows run on Astral's paid runners (for example `depot-ubuntu-24.04-4`),
# which are not available to this repository. This workflow only uses standard GitHub-hosted
# runners, which are free for public repositories.
#
# The action pins and the maturin version below follow Ruff's `.github/workflows/build-binaries.yml`
# (https://github.com/astral-sh/ruff/blob/main/.github/workflows/build-binaries.yml). Muff does not
# keep Ruff's workflows, so bump them here when they fall behind Ruff's.
#
# How to release:
#
# A push to `main` that changes the version in `pyproject.toml` releases that version. Usually
# this is the merge of a pull request from `[muff] Sync with Ruff` (`muff-sync-upstream.yml`),
# which brings in a Ruff release and its version. To release by hand instead, or to retry a
# failed release, go to Actions -> "[muff] Release" -> "Run workflow" on `main`, and uncheck
# "dry-run".
#
# The release runs in this order, so that nothing becomes public until every step has worked:
#
# 1. `plan` checks the version and that the run is on `main`. A push whose version has already
#    been released stops here without an error. Otherwise, `plan` fails right away if the tag
#    already exists, the version is already on PyPI, or the Ruff release with the same version
#    is not in the history of the commit being released.
# 2. `sdist` and `build` build and test the sdist, wheels, and standalone binaries.
# 3. `github-release` uploads everything to a *draft* GitHub release.
# 4. `pypi-publish` publishes the sdist and wheels to PyPI.
# 5. `publish-release` publishes the draft, which creates the tag on the built commit.
# 6. `update-pre-commit` starts the workflow in `jsh9/muff-pre-commit` that points the hooks at
#    the new version.
#
# If a step fails:
#
# - In steps 1-4, nothing public has changed. Fix the problem and either use "Re-run failed jobs"
#   or start a manual run (a new run replaces the leftover draft release).
# - In step 5, PyPI already has the release, so a new run would stop at `plan`. Use "Re-run failed
#   jobs", or publish the draft release by hand on GitHub.
# - In step 6, use "Re-run failed jobs", or run the `main` workflow in `jsh9/muff-pre-commit` by
#   hand. Step 6 needs the `MUFF_AUTOMATION_TOKEN` secret described in `muff-sync-upstream.yml`.
#
# PyPI publishing uses trusted publishing, so no API token is needed. The PyPI project must list
# this repository, the workflow file `muff-release.yml`, and the environment `pypi` as a trusted
# publisher. The `pypi` environment only allows deployments from `main`.
#
# With "dry-run" checked (the default), the workflow only runs steps 1-2. Pull requests that change
# this file or the build configuration also run steps 1-2, but never release or publish.
name: "[muff] Release"

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only build and test; do not create a GitHub release or publish to PyPI"
        type: boolean
        default: true
  push:
    branches: [main]
    # The version is in `pyproject.toml`. `plan` skips the release if the version did not change.
    paths:
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/muff-release.yml
      - .cargo/config.toml
      - Cargo.toml
      - crates/ruff/Cargo.toml
      - pyproject.toml
      - python/**
      - rust-toolchain.toml
      - scripts/transform_readme.py

concurrency:
  group: muff-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Release jobs must not consume shared GitHub Actions caches.
  ACTIONS_CACHE_MODE: none
  PYTHON_VERSION: "3.13"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ruff-version: ${{ steps.plan.outputs.ruff-version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Plan release"
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          # - `release`: a manual run with "dry-run" unchecked. Any problem stops the run.
          # - `auto`: a push to `main` that changed `pyproject.toml`. Releases the version if it has
          #   not been released yet, and otherwise does nothing (the push changed something else).
          # - `check`: a dry run or a pull request. Problems are only reported as warnings.
          case "${GITHUB_EVENT_NAME}:${DRY_RUN}" in
            workflow_dispatch:false) mode="release" ;;
            push:*) mode="auto" ;;
            *) mode="check" ;;
          esac
          echo "Mode: ${mode}"

          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "Muff version: ${version}"

          # Muff normally uses the same version as the Ruff release it is based on (e.g. `0.17.6`).
          # A fork-only release adds a fourth number (e.g. `0.12.11.1`).
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Version '${version}' in pyproject.toml is not of the form X.Y.Z or X.Y.Z.N."
            exit 1
          fi
          ruff_version=""
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ruff_version="${version}"
          fi

          # Prints the HTTP status code of a GET request, or `000` if the request failed.
          http_status() {
            curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "$@" \
              || echo "000"
          }

          # `released` lists the signs that this version has already been released. `problems` lists
          # everything else that should stop a release.
          released=()
          problems=()

          if [[ "${mode}" != "check" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            problems+=("Releases must run on main, not ${GITHUB_REF}.")
          fi

          # Only treat a 404 as "does not exist", so that an API error cannot hide an existing tag.
          tag_status="$(http_status \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GH_REPO}/git/ref/tags/${version}")"
          case "${tag_status}" in
            404) ;;
            200) released+=("Tag ${version} already exists in ${GH_REPO}.") ;;
            *) problems+=("Could not check whether tag ${version} exists (HTTP ${tag_status}).") ;;
          esac

          pypi_status="$(http_status "https://pypi.org/pypi/muff/${version}/json")"
          case "${pypi_status}" in
            404) ;;
            200) released+=("muff ${version} is already on PyPI.") ;;
            *) problems+=("Could not check whether muff ${version} is on PyPI (HTTP ${pypi_status}).") ;;
          esac

          # The Ruff release must be part of this commit's history. It is not if a pull request from
          # `[muff] Sync with Ruff` was squash-merged or rebased, which copies Ruff's changes without
          # recording the merge, so that the next sync conflicts on everything Ruff changed since.
          if [[ -n "${ruff_version}" ]]; then
            if ! ruff_commit="$(gh api "repos/astral-sh/ruff/commits/${ruff_version}" --jq .sha)"; then
              problems+=("Could not find the commit of Ruff ${ruff_version}.")
            elif ! ancestry="$(gh api "repos/${GH_REPO}/compare/${ruff_commit}...${GITHUB_SHA}" --jq .status)"; then
              problems+=("Could not compare Ruff ${ruff_version} (${ruff_commit}) with ${GITHUB_SHA}.")
            elif [[ "${ancestry}" != "ahead" && "${ancestry}" != "identical" ]]; then
              problems+=("Ruff ${ruff_version} (${ruff_commit}) is not in the history of ${GITHUB_SHA}. Was the sync pull request merged without a merge commit? Revert it and merge Ruff ${ruff_version} again.")
            fi
          fi

          release="false"
          if [[ "${mode}" == "auto" && ${#released[@]} -gt 0 ]]; then
            for reason in "${released[@]}"; do
              echo "::notice::${reason} Nothing to release."
            done
          else
            problems+=("${released[@]}")
            for problem in "${problems[@]}"; do
              if [[ "${mode}" == "check" ]]; then
                echo "::warning::${problem} (ignored because this run does not release)"
              else
                echo "::error::${problem}"
              fi
            done
            if [[ "${mode}" != "check" ]]; then
              if [[ ${#problems[@]} -gt 0 ]]; then
                exit 1
              fi
              release="true"
            fi
          fi
          echo "Release: ${release}"

          {
            echo "version=${version}"
            echo "ruff-version=${ruff_version}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  sdist:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Prep README.md"
        run: python scripts/transform_readme.py --target pypi
      - name: "Build sdist"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - name: "Test sdist"
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          # pip builds the sdist outside the checkout, where `rust-toolchain.toml` no longer
          # applies. Make the repository's toolchain the default so that the build uses it.
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f1)"

          python -m pip install "dist/muff-${VERSION}.tar.gz" --force-reinstall
          muff --help > /dev/null
          python -m ruff --help > /dev/null

          # Check that the formatter adds the extra level of indentation to function parameters,
          # which is the one behavior that distinguishes Muff from Ruff.
          printf 'def f(argument_number_one, argument_number_two, argument_number_three, argument_number_four):\n    pass\n' \
            | muff format --isolated - > formatted.py
          cat formatted.py
          grep -qx '        argument_number_one,' formatted.py
      - name: "Upload sdist"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          compression-level: 0
          path: dist

  build:
    name: build (${{ matrix.target }})
    needs: [plan]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            manylinux: ""
            docker-options: ""
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: "2_17"
            docker-options: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: "2_17"
            # See https://github.com/astral-sh/ruff/issues/3791 and
            # https://github.com/gnzlbg/jemallocator/issues/170#issuecomment-1503228963
            docker-options: "-e JEMALLOC_SYS_WITH_LG_PAGE=16"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            manylinux: ""
            docker-options: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Prep README.md"
        run: python scripts/transform_readme.py --target pypi
      - name: "Build wheel"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: ${{ matrix.docker-options }}
          args: --release --locked --out dist --compatibility pypi
      - name: "Test wheel"
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          # The glob also checks that the wheel has the version from pyproject.toml.
          python -m pip install dist/muff-"${VERSION}"-*.whl --force-reinstall
          muff --help > /dev/null
          python -m ruff --help > /dev/null

          # Check that the formatter adds the extra level of indentation to function parameters,
          # which is the one behavior that distinguishes Muff from Ruff.
          printf 'def f(argument_number_one, argument_number_two, argument_number_three, argument_number_four):\n    pass\n' \
            | muff format --isolated - > formatted.py
          cat formatted.py
          grep -qx '        argument_number_one,' formatted.py
      - name: "Upload wheel"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          compression-level: 0
          path: dist
      - name: "Archive binary"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          exe=""
          if [[ "${TARGET}" == *windows* ]]; then
            exe=".exe"
          fi

          archive_name="muff-${TARGET}"
          archive_file="${archive_name}.tar.gz"

          mkdir -p "artifacts/${archive_name}"
          cp "target/${TARGET}/release/muff${exe}" "artifacts/${archive_name}/muff${exe}"
          tar -C artifacts -czvf "artifacts/${archive_file}" "${archive_name}"
          rm -rf "artifacts/${archive_name}"

          cd artifacts
          if command -v sha256sum > /dev/null; then
            sha256sum "${archive_file}" > "${archive_file}.sha256"
          else
            shasum -a 256 "${archive_file}" > "${archive_file}.sha256"
          fi
          cat "${archive_file}.sha256"
      - name: "Upload binary"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.target }}
          compression-level: 0
          path: artifacts

  github-release:
    needs: [plan, sdist, build]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # For creating the draft GitHub release.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: "Create draft GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          RUFF_VERSION: ${{ needs.plan.outputs.ruff-version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A draft left behind by an earlier, failed run has never been public, so replace it.
          # (`plan` has already checked that no tag, and therefore no published release, exists.)
          existing_draft="$(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"${VERSION}\") | .id")"
          for release_id in ${existing_draft}; do
            echo "Deleting leftover draft release ${release_id} for ${VERSION}"
            gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}"
          done

          {
            if [[ -n "${RUFF_VERSION}" ]]; then
              echo "Muff ${VERSION}, based on [Ruff ${RUFF_VERSION}](https://github.com/astral-sh/ruff/releases/tag/${RUFF_VERSION})."
            else
              echo "Muff ${VERSION}."
            fi
            echo
            echo "## Installation"
            echo
            echo "From PyPI:"
            echo
            echo '```bash'
            echo "pip install muff==${VERSION}"
            echo '```'
            echo
            echo 'Or download the standalone binary for your platform (`muff-<target>.tar.gz`) from the assets below.'
            echo 'Since 0.17.6, the Windows binary is built with MSVC (`muff-x86_64-pc-windows-msvc.tar.gz`)'
            echo 'instead of MinGW (`muff-x86_64-pc-windows-gnu.tar.gz`).'
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat artifacts/*.sha256
            echo '```'
          } > release-notes.md
          cat release-notes.md

          # The tag is only created when the draft is published, on `RELEASE_COMMIT`.
          gh release create "${VERSION}" \
            --draft \
            --target "${RELEASE_COMMIT}" \
            --title "muff ${VERSION}" \
            --notes-file release-notes.md \
            artifacts/muff-*.tar.gz \
            artifacts/muff-*.tar.gz.sha256 \
            dist/*.whl \
            dist/*.tar.gz

  pypi-publish:
    needs: [github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/muff/
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      # Pin uv and verify its checksum, as in `.github/actions/setup-ruff-workspace`.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          checksum: "bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c"
          enable-cache: false
      - name: "Publish to PyPI"
        run: uv publish -v dist/*

  publish-release:
    needs: [plan, pypi-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # For publishing the draft release, which creates the tag.
      contents: write
    steps:
      - name: "Publish GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release edit "${VERSION}" --draft=false --latest

  update-pre-commit:
    needs: [plan, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Update muff-pre-commit"
        env:
          # `GITHUB_TOKEN` cannot start workflows in other repositories.
          GH_TOKEN: ${{ secrets.MUFF_AUTOMATION_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          # The `main` workflow in muff-pre-commit finds new versions with PyPI's JSON API, which can
          # take a few minutes to list a new release. Wait until it does, so that the run is not a
          # no-op.
          for _ in $(seq 1 40); do
            if curl --silent --fail --retry 3 "https://pypi.org/pypi/muff/json" \
              | jq --exit-status --arg version "${VERSION}" '.releases | has($version)' > /dev/null
            then
              gh workflow run main.yml --repo jsh9/muff-pre-commit --ref main
              echo "Started the main workflow in jsh9/muff-pre-commit for muff ${VERSION}."
              exit 0
            fi
            sleep 30
          done

          echo "::error::PyPI's JSON API did not list muff ${VERSION} after 20 minutes. Run the main workflow in jsh9/muff-pre-commit by hand."
          exit 1
